<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self' blob:; connect-src 'self' https://arquivos.infra-questoes.grancursosonline.com.br https://arquivos.qconcursos.com https://cdn.direcaoconcursos.com.br https://s3-improved-files-sec1.iesde.com.br https://www.acheconcursos.com.br https://www.aprovaconcursos.com.br https://www.cesgranrio.org.br; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; manifest-src 'self'">
<meta name="referrer" content="no-referrer">
<title>Prioriza Bancários</title>
<meta name="theme-color" content="#0f5c55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prioriza">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url(inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url(inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url(inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:swap;src:url(inter-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Source Serif 4';font-style:normal;font-weight:400;font-display:swap;src:url(source-serif-4-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Source Serif 4';font-style:normal;font-weight:600;font-display:swap;src:url(source-serif-4-latin-600-normal.woff2) format('woff2')}

:root{
  --bg:#f5f3ee;--card:#ffffff;--ink:#1b2626;--muted:#62706f;--line:#e3dfd5;
  --pri:#0f5c55;--pri-2:#e3f0ed;--acc:#c98a12;--ok:#2e7d4a;--ok-bg:#e5f3e9;
  --bad:#b83a26;--bad-bg:#fbe8e3;--chip:#efece4;--shadow:0 1px 2px rgba(20,30,30,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121716;--card:#1a2120;--ink:#e6ecea;--muted:#9aa8a6;--line:#2a3432;
  --pri:#4fb3a7;--pri-2:#1c302d;--acc:#e0aa3e;--ok:#5cc07f;--ok-bg:#183223;
  --bad:#ef7a64;--bad-bg:#3a1f1a;--chip:#232c2b;--shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:34px;height:34px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px}
.brand b{display:block;font-size:16px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.err{background:var(--bad-bg);color:var(--bad)}
main{max-width:760px;margin:0 auto;padding:16px 16px 104px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:6}
.tabs button{flex:1;max-width:170px;border:0;background:none;padding:7px 4px;border-radius:12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tabs button svg{width:20px;height:20px}
.tabs button.on{color:var(--pri);background:var(--pri-2);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:24px 4px 10px;font-weight:600}
h2:first-child{margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em;font-weight:700}
.kpi span{font-size:12px;color:var(--muted)}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn.danger{background:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.topic{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.topic:first-child{border-top:0;padding-top:2px}
.rank{width:28px;height:28px;border-radius:8px;background:var(--chip);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.topic:first-child .rank{background:var(--pri);color:#fff}
.tname{font-weight:600}
.tmeta{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dc{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.bar{height:6px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:6px}
.lo{background:var(--bad)} .mid{background:var(--acc)} .hi{background:var(--ok)}
.na{background:repeating-linear-gradient(45deg,var(--line) 0 4px,transparent 4px 8px)!important;width:100%!important}
.disc{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.disc:first-child{border-top:0;padding-top:0}
.disc .dn{font-weight:500;display:flex;gap:7px;align-items:center}
.disc .pts{font-size:12px;color:var(--muted);text-align:right}
details.info summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.info summary::-webkit-details-marker{display:none}
details.info summary::after{content:'+';font-size:18px;color:var(--muted)}
details.info[open] summary::after{content:'−'}
details.info p,details.info li{font-size:14px;color:var(--muted)}
table.pesos{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.pesos td{padding:5px 0;border-top:1px solid var(--line)}
table.pesos td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--pri-2);color:var(--pri);border-radius:99px;padding:5px 6px 5px 12px;font-size:13px;font-weight:500}
.chip button{border:0;background:none;color:inherit;cursor:pointer;font-size:15px;padding:0 6px;line-height:1}
select,input,textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:var(--card);color:var(--ink)}
select:focus,input:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:transparent}
textarea{min-height:92px;resize:vertical;line-height:1.45}
label.lb{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
.sess{font-size:12px;color:var(--muted);margin:10px 2px 0}
.why{font-size:13px;background:var(--pri-2);color:var(--pri);padding:9px 12px;border-radius:10px;margin-bottom:12px;font-weight:500}
.qmeta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.stxt{margin:0 0 14px;border:1px solid var(--line,#ddd);border-radius:10px;background:var(--bg)}.stxt summary{cursor:pointer;padding:9px 12px;font-weight:600;font-size:14px}.stxt div{padding:0 12px 12px;max-height:46vh;overflow:auto;white-space:pre-wrap;font-family:'Source Serif 4',Georgia,serif;font-size:15px;line-height:1.55}
.rev{margin:12px 0;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}.rev.bad{border-color:#d9a441;background:rgba(217,164,65,.10)}.rev .t{font-size:13px;font-weight:700;margin-bottom:4px}.rev.mini{margin:6px 0 0;padding:6px 8px}.rev.mini .t{display:none}
.lnk{display:block;text-align:left;background:none;border:0;padding:4px 0;color:inherit;font:inherit;font-size:14px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer}
.rev.mini .lnk{font-size:12.5px;padding:2px 0}
.mattext{white-space:pre-wrap;font-family:'Source Serif 4',Georgia,serif;font-size:15.5px;line-height:1.6;max-height:60vh;overflow:auto;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.msec{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-top:1px solid var(--line)}.msec select{font-size:13px;padding:6px}
.qtext{font-family:'Source Serif 4',Georgia,serif;font-size:17px;line-height:1.55;margin:0 0 14px;white-space:pre-wrap}
.alts{display:flex;flex-direction:column;gap:8px}
.alt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;cursor:pointer;line-height:1.4}
.alt:hover:not([disabled]){border-color:var(--pri)}
.alt[disabled]{cursor:default}
.alt .L{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;margin-top:-2px}
.alt.right{border-color:var(--ok);background:var(--ok-bg)}
.alt.right .L{background:var(--ok);color:#fff;border-color:var(--ok)}
.alt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.alt.wrong .L{background:var(--bad);color:#fff;border-color:var(--bad)}
.fb{border-radius:12px;padding:11px 12px;margin-top:14px;font-weight:600;font-size:14px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.guess{display:flex;align-items:center;gap:10px;margin:2px 0 10px;flex-wrap:wrap}
.gbtn{border:1px dashed var(--line);background:none;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink);font-family:inherit}
.gbtn.on{border-style:solid;border-color:#b7791f;background:#fdf3e1;color:#8a5a12;font-weight:600}
.fb.meh{background:#fdf3e1;color:#8a5a12}
.linkbtn{border:0;background:none;padding:0;color:inherit;text-decoration:underline;font:inherit;font-weight:500;cursor:pointer;margin-left:4px}
.exp{margin-top:14px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.exp .t{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:4px}
.mycom{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.mycom .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.mycom .hd b{font-size:14px}
.saved{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:16px}
.actions .btn{flex:1}
.empty{text-align:center;padding:28px 16px}
.empty b{display:block;font-size:17px;margin-bottom:6px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.filters input{grid-column:1 / -1}
details.qi{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
details.qi summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
details.qi summary::-webkit-details-marker{display:none}
details.qi .dot{margin-top:6px}
.qs-meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qs-text{font-size:14px;margin-top:3px}
.bdg{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--muted);font-weight:600}
.bdg.ok{background:var(--ok-bg);color:var(--ok)} .bdg.bad{background:var(--bad-bg);color:var(--bad)} .bdg.me{background:var(--pri-2);color:var(--pri)}
.qi-body{padding:0 14px 14px}
.qi-body .alt{cursor:default}
.modal{position:fixed;inset:0;background:rgba(10,15,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 4px;font-size:18px}
.altin{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin-bottom:6px}
.altin label{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;cursor:pointer}
.altin input[type=radio]{width:18px;height:18px;margin:0;accent-color:var(--pri)}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:1em}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.prv{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.prv b{display:block;font-size:14px}
.prv ol{margin:8px 0;padding-left:18px}
.prv li{margin-bottom:4px}
.prv a{color:var(--pri);font-weight:600}
.prv input[type=file]{padding:8px;font-size:13px}
.imp-res{background:var(--pri-2);border-radius:12px;padding:12px;margin-top:10px;font-size:14px}
.imp-res ul{margin:6px 0 10px;padding-left:18px}
.warn{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
.figflag{font-size:12px;color:var(--acc);font-weight:600;margin-bottom:8px}
.today{display:flex;gap:14px;align-items:center}
.ring{--p:0;--rc:var(--acc);width:68px;height:68px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--rc) calc(var(--p)*1turn),var(--chip) 0)}
.ring.done{--rc:var(--ok)}
.ring>div{width:54px;height:54px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.ring b{font-size:20px;font-weight:700}.ring span{font-size:10px;color:var(--muted)}
.tinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.streak{font-weight:700;font-size:16px}
.metabtn{font:inherit;font-size:11px;line-height:1.2;color:var(--muted);background:var(--chip);border:0;border-radius:10px;padding:7px 9px;cursor:pointer;text-align:center;flex:none}
.metabtn b{font-size:16px;color:var(--ink)}
.maptop{font-size:14px;margin-bottom:6px}
.bar.stack{display:flex}.bar.stack i{border-radius:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:8px 0 12px}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.sw.nt{background:var(--line)}
.mapd{margin-bottom:12px}
.tiles{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tile{font:inherit;font-size:12px;line-height:1.25;text-align:left;padding:6px 9px;border-radius:9px;border:1px solid var(--line);cursor:pointer;color:var(--muted);background:var(--chip);display:inline-flex;gap:6px;align-items:baseline}
.tile b{font-size:11px;font-weight:700}
.tile.lo{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.tile.mid{background:color-mix(in srgb,var(--acc) 16%,var(--card));color:var(--ink);border-color:transparent}
.tile.mid b{color:var(--acc)}
.tile.hi{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.rprog{margin:0 2px 10px}.rprog .bar{margin-top:4px}
.rsum .rtit{font-size:20px;font-weight:700;margin:4px 0 2px}
.rbig{display:flex;align-items:baseline;gap:8px;margin:6px 0 10px}.rbig b{font-size:40px;letter-spacing:-.02em;color:var(--pri)}.rbig span{color:var(--muted)}
.rsec{border-top:1px solid var(--line);padding:10px 0 4px}.rsec .t{font-weight:600;font-size:14px;margin-bottom:4px}
.rsec ul{margin:0;padding-left:18px;font-size:14px}.rsec li{margin:2px 0}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">P</span><div><b>Prioriza</b><small>Concursos bancários</small></div></div>
  <span id="status" class="pill">Carregando…</span>
</header>
<main id="app"></main>
<nav class="tabs" id="tabs">
  <button data-act="tab" data-tab="painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Painel</button>
  <button data-act="tab" data-tab="treinar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>Treinar</button>
  <button data-act="tab" data-tab="banco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Banco</button>
</nav>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast"></div>
<script src="boot.js"></script>
<script src="app.js"></script>
</body>
</html>
